<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学生热梗雷达</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red: #A42423;
  --red-light: #c43a39;
  --red-dark: #7a1a1a;
  --cream: #FFF2DF;
  --cream-dark: #f5e6cf;
  --white: #ffffff;
  --text: #1a1a1a;
  --text-2: #4a4a4a;
  --text-3: #888;
  --border: rgba(164,36,35,0.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", monospace;
}

html { font-size: 15px; }
body {
  font-family: var(--font);
  background: var(--cream);
  color: var(--text);
  line-height: 1.5;
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 200px;
  min-width: 200px;
  background: var(--red);
  color: var(--white);
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: 20px 0;
}
.logo {
  padding: 0 20px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  margin-bottom: 12px;
}
.logo h1 {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.logo .sub {
  font-size: 0.68rem;
  opacity: 0.7;
  margin-top: 2px;
}

.nav-group {
  padding: 0 12px;
}
.nav-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.5;
  padding: 12px 8px 6px;
}
.nav-item {
  display: block;
  width: 100%;
  border: none;
  background: transparent;
  color: var(--white);
  text-align: left;
  padding: 9px 14px;
  font-size: 0.85rem;
  font-family: var(--font);
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
  opacity: 0.8;
}
.nav-item:hover { background: rgba(255,255,255,0.1); opacity: 1; }
.nav-item.active {
  background: rgba(255,255,255,0.18);
  opacity: 1;
  font-weight: 600;
}

.sidebar-footer {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.12);
  font-size: 0.65rem;
  opacity: 0.5;
  line-height: 1.6;
}

/* ===== Main Content ===== */
.main {
  flex: 1;
  height: 100vh;
  overflow-y: auto;
  padding: 28px 36px;
}

/* ===== Panel (each tab) ===== */
.panel { display: none; }
.panel.active { display: block; }

/* ===== Table Styles ===== */
.table-wrapper {
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.84rem;
}
thead th {
  background: var(--red);
  color: var(--white);
  font-weight: 600;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 10px 14px;
  text-align: left;
  position: sticky;
  top: 0;
  z-index: 2;
}
thead th:first-child { padding-left: 20px; }
tbody tr { border-bottom: 1px solid rgba(164,36,35,0.06); }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(164,36,35,0.03); }
tbody td {
  padding: 9px 14px;
  vertical-align: middle;
}
tbody td:first-child { padding-left: 20px; }

.rank-cell {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--text-3);
  width: 40px;
}
.rank-cell.top3 { color: var(--red); }

/* Heat dots */
.heat {
  display: flex;
  gap: 3px;
}
.heat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #e8e0d8;
}
.heat-dot.on { background: var(--red); }

/* Trend */
.trend {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
}
.trend-new { background: rgba(164,36,35,0.1); color: var(--red); }
.trend-up { background: rgba(34,139,34,0.08); color: #228b22; }
.trend-stable { background: rgba(0,0,0,0.04); color: var(--text-3); }
.trend-down { background: rgba(70,130,180,0.08); color: steelblue; }

/* Probability */
.prob {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
}
.prob-high { background: rgba(164,36,35,0.12); color: var(--red); }
.prob-medium { background: rgba(200,150,50,0.1); color: #9a7030; }

/* ===== Daily Report ===== */
.date-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}
.date-header h2 {
  font-size: 1.1rem;
  font-weight: 700;
  min-width: 160px;
  text-align: center;
}
.date-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  background: var(--white);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  color: var(--text-2);
  transition: all 0.15s;
}
.date-btn:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
.date-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.date-picker-wrap {
  position: relative;
  margin-left: 12px;
}
.date-picker-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--white);
  border-radius: 6px;
  font-size: 0.78rem;
  color: var(--text-2);
  cursor: pointer;
  font-family: var(--font);
}
.date-picker-btn:hover { border-color: var(--red); color: var(--red); }
.date-input {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0;
  cursor: pointer;
}

/* Daily cards */
.daily-section-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--red);
  margin: 24px 0 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--red);
  display: inline-block;
}
.daily-section-title:first-child { margin-top: 0; }

.meme-row {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 10px;
  display: grid;
  grid-template-columns: 32px 1fr;
  gap: 12px;
}
.meme-row .m-rank {
  font-family: var(--mono);
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--text-3);
}
.meme-row .m-rank.top3 { color: var(--red); }
.meme-row .m-name {
  font-weight: 700;
  font-size: 0.92rem;
  margin-bottom: 4px;
}
.meme-row .m-time {
  font-size: 0.74rem;
  color: var(--red);
  font-weight: 500;
  margin-bottom: 6px;
}
.meme-row .m-desc {
  font-size: 0.8rem;
  color: var(--text-2);
  line-height: 1.6;
}
.meme-row .m-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.meme-row .m-tag {
  font-size: 0.7rem;
  padding: 2px 8px;
  background: var(--cream);
  border-radius: 4px;
  color: var(--text-2);
}

/* Continuing grid */
.cont-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 8px;
}
.cont-chip {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
}
.cont-chip .c-name { font-weight: 600; font-size: 0.82rem; }
.cont-chip .c-status { font-size: 0.7rem; color: var(--text-3); margin-top: 2px; }

/* Radar list */
.radar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
}
.radar-row .r-name { font-weight: 600; font-size: 0.82rem; }
.radar-row .r-detail { font-size: 0.7rem; color: var(--text-3); }

/* ===== Guide section ===== */
.guide-block {
  padding: 16px 20px;
  border-radius: 8px;
  margin-bottom: 12px;
}
.guide-block h4 {
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 8px;
}
.guide-block .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.guide-block .tag {
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.76rem;
  background: rgba(255,255,255,0.6);
}
.guide-safe { background: rgba(34,139,34,0.06); border: 1px solid rgba(34,139,34,0.12); }
.guide-safe h4 { color: #228b22; }
.guide-warn { background: rgba(200,150,50,0.06); border: 1px solid rgba(200,150,50,0.12); }
.guide-warn h4 { color: #9a7030; }
.guide-danger { background: rgba(164,36,35,0.06); border: 1px solid rgba(164,36,35,0.12); }
.guide-danger h4 { color: var(--red); }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar { width: 56px; min-width: 56px; }
  .logo h1, .logo .sub, .nav-label, .sidebar-footer { display: none; }
  .nav-item { font-size: 0; padding: 12px; text-align: center; }
  .nav-item::before { font-size: 1rem; }
  .main { padding: 16px; }
}
</style>

<script>
const DATA = window.__EMBEDDED_DATA__;

// ===== Render all panels =====
function init() {
  renderHot();
  renderTime();
  renderPotential();
  renderClassic();
  renderGuide();
  renderDaily();
  setupNav();
  setupDateNav();
}

// ===== Hot Chart =====
function renderHot() {
  const rows = DATA.masterTable.hotChart.map(m => `
    <tr>
      <td class="rank-cell ${m.rank<=3?'top3':''}">${m.rank}</td>
      <td><strong>${m.name}</strong></td>
      <td><div class="heat">${[1,2,3,4,5].map(i=>`<div class="heat-dot ${i<=m.heat?'on':''}"></div>`).join('')}</div></td>
      <td>${trendTag(m.trend)}</td>
      <td style="font-size:0.75rem;color:var(--text-3)">${m.source}</td>
    </tr>`).join('');
  document.getElementById('hotTable').innerHTML = `
    <table><thead><tr><th>#</th><th>梗</th><th>热度</th><th>趋势</th><th>收录</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function trendTag(t) {
  const map = { new:'<span class="trend trend-new">新</span>', up:'<span class="trend trend-up">升</span>', stable:'<span class="trend trend-stable">平</span>', down:'<span class="trend trend-down">降</span>' };
  return map[t]||'';
}

// ===== Time Chart =====
function renderTime() {
  const rows = DATA.masterTable.timeChart.map(m => `
    <tr>
      <td class="rank-cell ${m.rank<=3?'top3':''}">${m.rank}</td>
      <td><strong>${m.name}</strong></td>
      <td style="color:var(--red);font-size:0.82rem">${m.time}</td>
      <td style="font-size:0.75rem;color:var(--text-3)">${m.source}</td>
    </tr>`).join('');
  document.getElementById('timeTable').innerHTML = `
    <table><thead><tr><th>#</th><th>梗</th><th>爆发时间</th><th>收录</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// ===== Potential Chart =====
function renderPotential() {
  const rows = DATA.masterTable.potentialChart.map(m => `

      <td><strong>${m.name}</strong></td>
      <td style="font-size:0.78rem">${m.heat}</td>
      <td style="font-size:0.78rem;color:var(--text-2)">${m.reason}</td>
      <td>${probTag(m.probability)}</td>
      <td style="font-size:0.75rem;color:var(--text-3)">${m.date}</td>

  document.getElementById('potentialTable').innerHTML = `

    <tbody>${rows}</tbody></table>`;

function probTag(p) {
  if (p==='high') return '<span class="prob prob-high">高</span>';
  return '<span class="prob prob-medium">中</span>';
}

  }

  let html = '';
  html += `<div class="daily-section-title">新梗 / 近期热梗 (${report.newMemes.length})</div>`;
  html += report.newMemes.map(m => `
    <div class="meme-row">
      <div class="m-rank ${m.rank<=3?'top3':''}">${m.rank}</div>
      <div>
        <div class="m-name">${m.name}</div>
        <div class="m-time">${m.fireTime}</div>
        <div class="m-desc">${m.what}</div>
        <div class="m-meta">
          <span class="m-tag">${m.platform}</span>
          <span class="m-tag">${m.channel}</span>
          ${m.link?`<a class="m-tag" href="${m.link}" target="_blank" style="color:var(--red);text-decoration:none">查看来源</a>`:''}
        </div>
      </div>
    </div>`).join('');

  if (report.continuing && report.continuing.length > 0) {
    html += `<div class="daily-section-title">持续热门 (${report.continuing.length})</div>`;
    html += '<div class="cont-grid">';
    html += report.continuing.map(m => `
      <div class="cont-chip"><div class="c-name">${m.name}</div><div class="c-status">${m.status}</div></div>`).join('');
    html += '</div>';
  }

  if (report.radar && report.radar.length > 0) {
    html += `<div class="daily-section-title">雷达预警 (${report.radar.length})</div>`;
    html += report.radar.map(m => `
      <div class="radar-row">
        <div><div class="r-name">${m.name}</div><div class="r-detail">${m.detail}</div></div>
        <span class="prob ${m.probability==='中高'||m.probability==='高'?'prob-high':'prob-medium'}">${m.probability}</span>
      </div>`).join('');
  }

  document.getElementById('dailyContent').innerHTML = html;
}

function formatDate(d) { const [y,m,day]=d.split('-'); return `${y}年${+m}月${+day}日`; }

// ===== Navigation =====
function setupNav() {
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    });
  });
}

function setupDateNav() {
  document.getElementById('prevDate').addEventListener('click', () => {
    if (currentDateIdx < DATA.availableDates.length - 1) { currentDateIdx++; updateDailyView(); }
  });
  document.getElementById('nextDate').addEventListener('click', () => {
    if (currentDateIdx > 0) { currentDateIdx--; updateDailyView(); }
  });

  // Date picker
  const picker = document.getElementById('datePicker');
  const dates = DATA.availableDates;
  picker.min = dates[dates.length - 1];
  picker.max = dates[0];
  picker.value = dates[0];
  picker.addEventListener('change', () => {
    const idx = dates.indexOf(picker.value);
    if (idx >= 0) { currentDateIdx = idx; updateDailyView(); }
  });
}

// ===== Init =====
init();
</script>
